name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python: "3.12"
            constraints: https://opendev.org/openstack/requirements/raw/tag/2025.1-eom/upper-constraints.txt
            horizon: "25.3.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Horizon ${{ matrix.horizon }} under the ${{ matrix.constraints }} constraints
        run: |
          python -m pip install --upgrade pip wheel 'setuptools<80'
          curl -fsSL -o /tmp/uc.txt "${{ matrix.constraints }}"
          # XStatic packages of this Horizon release need pkg_resources at
          # build time, which setuptools>=80 no longer ships.
          pip install --no-build-isolation -c /tmp/uc.txt "horizon==${{ matrix.horizon }}" \
            -r requirements.txt -r test-requirements.txt
          pip install --no-deps -e .
      - name: flake8
        run: flake8 .
      - name: Unit tests
        run: python manage.py test neutron_taas_dashboard --settings=neutron_taas_dashboard.test.settings
