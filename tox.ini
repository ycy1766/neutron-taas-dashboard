[tox]
envlist = py3,pep8
minversion = 3.18.0
skipsdist = True
ignore_basepython_conflict = True

[testenv]
usedevelop = True
basepython = python3
setenv = VIRTUAL_ENV={envdir}
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2025.1}
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands =
  python manage.py test {posargs} --settings=neutron_taas_dashboard.test.settings

[testenv:pep8]
commands =
  flake8 {posargs}

[testenv:venv]
commands = {posargs}

[testenv:cover]
commands =
  coverage erase
  coverage run {toxinidir}/manage.py test neutron_taas_dashboard --settings=neutron_taas_dashboard.test.settings {posargs}
  coverage xml --omit '.tox/cover/*' -o 'cover/coverage.xml'
  coverage html --omit '.tox/cover/*' -d 'cover/htmlcov'

[flake8]
exclude = .venv,.git,.tox,dist,*lib/python*,*egg,build,node_modules,.tmp
# H106: Don't put vim configuration in source files
# H203: Use assertIs(Not)None to check for None
# H204: Use assert(Not)Equal to check for equality
# H205: Use assert(Greater|Less)(Equal) for comparison
enable-extensions = H106,H203,H204,H205
# W504 line break after binary operator
ignore = W504
max-complexity = 20
import-order-style = pep8
application-import-names = neutron_taas_dashboard
per-file-ignores =
    neutron_taas_dashboard/test/settings.py:F403,F405
